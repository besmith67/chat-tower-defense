<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Tower Defense</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%239146ff'/%3E%3Ccircle cx='12' cy='14' r='3' fill='%23fff'/%3E%3Ccircle cx='20' cy='14' r='3' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <form id="setup" class="setup" autocomplete="off">
      <h1>Chat Tower Defense</h1>
      <p class="tagline">You defend. Chat attacks. Every word they type becomes a monster.</p>

      <fieldset>
        <legend>Who sends the monsters?</legend>
        <label class="choice"><input type="radio" name="mode" value="blended" checked />
          <span><b>Blended</b> Chat sends monsters, and the Wilds fill any gap.</span></label>
        <label class="choice"><input type="radio" name="mode" value="chat-only" />
          <span><b>Chat only</b> Only chat attacks. For busy chats.</span></label>
        <label class="choice"><input type="radio" name="mode" value="offline" />
          <span><b>Offline practice</b> Only the Wilds. Chat is ignored.</span></label>
      </fieldset>

      <label class="field">Map
        <select name="map"></select>
      </label>

      <label class="field">Twitch channel <span class="hint">Read-only. No login needed.</span>
        <input name="channel" placeholder="your_channel" spellcheck="false" />
      </label>

      <label class="field">Kick channel <span class="hint">Optional. Works alone or together with Twitch.</span>
        <input name="kick" placeholder="your_kick_channel" spellcheck="false" />
      </label>

      <div class="row-buttons">
        <button type="button" id="open-studio" class="secondary">Emote Studio</button>
        <button type="button" id="open-bestiary" class="secondary">Bestiary</button>
      </div>

      <label class="check"><input type="checkbox" name="showNames" checked /> Show viewer names on monsters</label>

      <label class="field">Blocked words <span class="hint">Optional, comma separated. A profanity filter is always on.</span>
        <input name="blocklist" placeholder="spoiler, another" spellcheck="false" />
      </label>

      <button type="submit">Start</button>
      <p class="hint small">Tip: add <code>?channel=name&amp;mode=blended&amp;autostart=1</code> to the URL to skip this screen.</p>
    </form>

    <form id="test-chat" class="test-chat hidden" autocomplete="off">
      <input name="message" placeholder="Type as chat, then Enter. Try snail, ghost, dig, angry, fier, megasnail, KEKW..." spellcheck="false" />
      <button type="submit">Send</button>
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
